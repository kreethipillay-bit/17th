<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy 17th Birthday</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    width: 100vw;
    height: 100vh;
    background: black;
    font-family: Arial, sans-serif;
    overflow: auto;
}

/* NAME SCREEN */

#nameScreen {
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.name-box {
    width: 300px;
    background: #c0c0c0;
    border-top: 2px solid white;
    border-left: 2px solid white;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;
    padding: 3px;
    box-shadow: 4px 4px 8px rgba(0,0,0,0.6);
}

/* WINDOWS TITLE BAR */

.title-bar {
    height: 25px;
    background: #000080;
    color: white;
    padding: 3px 3px 3px 6px;
    font-size: 13px;
    font-weight: bold;

    display: flex;
    justify-content: space-between;
    align-items: center;
}

/* NAME BOX */

.name-content {
    padding: 25px;
    text-align: center;
    color: black;
}

input {
    width: 100%;
    padding: 8px;
    margin-top: 15px;
    background: white;
    color: black;
    border: 2px inset white;
    font-size: 16px;
}

button {
    margin-top: 15px;
    min-width: 75px;
    padding: 5px 15px;
    background: #c0c0c0;
    color: black;

    border-top: 2px solid white;
    border-left: 2px solid white;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;

    cursor: pointer;
}

button:active {
    border-top: 2px solid #404040;
    border-left: 2px solid #404040;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
}

#error {
    color: #a00000;
    font-size: 13px;
    margin-top: 10px;
}

/* WINDOWS POPUP */

.popup {
    position: absolute;
    width: 300px;
    max-width: calc(100vw - 20px);

    background: #c0c0c0;

    border-top: 2px solid white;
    border-left: 2px solid white;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;

    padding: 3px;

    box-shadow:
        1px 1px 0 black,
        5px 5px 10px rgba(0,0,0,0.6);
}

/* X BUTTON */

.close-btn {
    width: 19px;
    height: 19px;

    background: #c0c0c0;
    color: black;

    border-top: 2px solid white;
    border-left: 2px solid white;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.close-btn:active {
    border-top: 2px solid #404040;
    border-left: 2px solid #404040;
    border-right: 2px solid white;
    border-bottom: 2px solid white;
}

/* MESSAGE */

.message {
    min-height: 85px;
    padding: 25px 20px 15px 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    color: black;
    text-align: center;
    font-size: 14px;
}

/* OK BUTTON */

.ok-btn {
    display: block;
    min-width: 75px;
    margin: 5px auto 15px auto;
    padding: 4px 18px;

    background: #c0c0c0;
    color: black;

    border-top: 2px solid white;
    border-left: 2px solid white;
    border-right: 2px solid #404040;
    border-bottom: 2px solid #404040;

    cursor: pointer;
}

/* SCANNER */

.scan-screen {
    width: 100vw;
    height: 100vh;

    background: black;
    color: #00ff00;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    text-align: center;

    font-family: "Courier New", monospace;
    padding: 20px;
}

.scan-main {
    font-size: 24px;
    font-weight: bold;
}

.scan-sub {
    margin-top: 15px;
    font-size: 14px;
}

/* FINAL SCREEN */

.final-screen {
    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: black;
    color: white;

    padding: 20px;
    text-align: center;
}

.final-main {
    font-size: 50px;
    font-weight: bold;
}

.final-update {
    margin-top: 25px;
    font-family: "Courier New", monospace;
    font-size: 18px;
    opacity: 0;

    animation: appear 1s ease forwards;
    animation-delay: 1.2s;
}

@keyframes appear {
    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

/* PHONE */

@media (max-width: 400px) {

    .popup {
        width: 280px;
    }

    .final-main {
        font-size: 36px;
    }

    .final-update {
        font-size: 15px;
    }

    .scan-main {
        font-size: 20px;
    }
}

</style>
</head>


<body>


<!-- NAME SCREEN -->

<div id="nameScreen">

    <div class="name-box">

        <div class="title-bar">
            <span>IDENTITY CHECK</span>
        </div>

        <div class="name-content">

            <div>Enter your name:</div>

            <input
                type="text"
                id="nameInput"
                placeholder="Your name"
                autocomplete="off"
            >

            <br>

            <button onclick="checkName()">
                Enter
            </button>

            <div id="error"></div>

        </div>

    </div>

</div>


<script>

/* YOUR MESSAGES */

const messages = [

    "HAPPY BIRTHDAY HARLEEIN",

    "A.K.A LARP QUEEN",

    "hopee you have a goodd one, but soundss like I ruined itt",

    "im sorryy forr thatt (im not)",

    "tooo more titles to be captureddd",

    "tooo more making mum and dad prouddd",

    "an inspirationn to brotherrr",

    "and yeahhh, stayyy healthyyy always",

    "stayyy safe always",

    "most importantlyy stayyy happyyy always",

    "and mayy the worlddd be kinderr to youu (i wont)",

    "im not trying tooo win yourrr heart or smthingg",

    "i justt wanteddd to wishh youu nyy",

    "dont gett me wrongggg :)",

    "... goodbyeee"

];

let currentMessage = 0;


/* CHECK NAME */

function checkName() {

    const name =
        document
        .getElementById("nameInput")
        .value
        .trim()
        .toLowerCase();

    const error =
        document.getElementById("error");

    if (name === "harleein") {

        startScan();

    }

    else {

        error.innerText =
            "nahhh thats not youu dumbassss 🤨";

    }

}


/* FAKE SCANNER */

function startScan() {

    document.body.innerHTML = `

        <div class="scan-screen">

            <div class="scan-main">
                SCANNING USER...
            </div>

            <div class="scan-sub">
                Checking identity...
            </div>

        </div>

    `;


    setTimeout(function() {

        document.querySelector(".scan-main").innerText =
            "LARPER DETECTED.";

        document.querySelector(".scan-sub").innerText =
            "Threat level: questionable";

    }, 1400);


    setTimeout(function() {

        document.body.innerHTML = "";

        createPopup();

    }, 2800);

}


/* CREATE POPUP */

function createPopup() {

    if (currentMessage >= messages.length) {

        showFinalScreen();

        return;

    }


    const popup =
        document.createElement("div");

    popup.className = "popup";


    /* RANDOM POSITION */

    const popupWidth = 300;
    const popupHeight = 180;

    const maxX =
        Math.max(
            10,
            window.innerWidth - popupWidth - 10
        );

    const maxY =
        Math.max(
            10,
            window.innerHeight - popupHeight - 10
        );

    const randomX =
        10 + Math.random() * Math.max(0, maxX - 10);

    const randomY =
        10 + Math.random() * Math.max(0, maxY - 10);


    popup.style.left =
        randomX + "px";

    popup.style.top =
        randomY + "px";


    /* TITLE */

    const titleBar =
        document.createElement("div");

    titleBar.className =
        "title-bar";

    titleBar.innerHTML = `

        <span>ERROR 404: LARPER FOUND</span>

        <span class="close-btn">X</span>

    `;


    /* MESSAGE */

    const message =
        document.createElement("div");

    message.className =
        "message";

    message.innerText =
        messages[currentMessage];


    /* OK */

    const okButton =
        document.createElement("button");

    okButton.className =
        "ok-btn";

    okButton.innerText =
        "OK";


    popup.appendChild(titleBar);

    popup.appendChild(message);

    popup.appendChild(okButton);

    document.body.appendChild(popup);


    const closeButton =
        popup.querySelector(".close-btn");


    /* NEXT MESSAGE */

    function closePopup() {

        popup.remove();

        currentMessage++;

        createPopup();

    }


    closeButton.onclick =
        closePopup;

    okButton.onclick =
        closePopup;

}


/* FINAL */

function showFinalScreen() {

    /* BLACK SCREEN FIRST */

    document.body.innerHTML = "";


    /* WAIT 1 SECOND */

    setTimeout(function() {

        document.body.innerHTML = `

            <div class="final-screen">

                <div class="final-main">
                    CONGRATS YOU'RE 17 🎉
                </div>

                <div class="final-update">
                    SYSTEM SUCCESSFULLY UPDATED<br><br>
                    16.0 → 17.0
                </div>

            </div>

        `;

    }, 1000);

}


/* ENTER KEY */

document
.getElementById("nameInput")
.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            checkName();

        }

    }
);

</script>

</body>
</html>
